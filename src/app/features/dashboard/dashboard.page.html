<div hlmCard class="w-full">
  <div hlmCardHeader>
    <h1 hlmCardTitle>Olá, {{ displayName() }}!</h1>
    <p hlmCardDescription>Você está autenticado.</p>
  </div>
  <div hlmCardContent>
    <p class="text-sm text-muted-foreground">{{ email() }}</p>
    <p class="mt-2 text-sm text-muted-foreground">
      Seus grupos de amigo secreto aparecerão aqui.
    </p>
  </div>
</div>

<!-- RA2-ID8 / D-12: Deferrable View. O card só é baixado e inicializado quando
     entra no viewport — e por isso a chamada HTTP à BrasilAPI também é diferida. -->
@defer (on viewport) {
  <div class="mt-4">
    <app-christmas-countdown />
  </div>
} @placeholder {
  <div class="mt-4 h-28 animate-pulse rounded-lg border bg-muted/40"></div>
}
