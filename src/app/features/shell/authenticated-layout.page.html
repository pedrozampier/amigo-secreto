<div class="flex min-h-dvh flex-col">
  @if (!online()) {
    <div
      class="sticky top-0 z-50 bg-foreground px-4 py-2 text-center text-sm font-medium text-background"
      role="status"
      aria-live="polite"
    >
      Você está offline. Algumas ações podem falhar.
    </div>
  }
  <header class="border-b">
    <div class="mx-auto flex w-full max-w-md items-center justify-between gap-2 p-4">
      <span class="text-sm font-semibold text-foreground">UTF-Secret</span>
      <div class="flex items-center gap-2">
        @if (displayName()) {
          <span class="max-w-[8rem] truncate text-xs text-muted-foreground">
            {{ displayName() }}
          </span>
        }
        <button hlmBtn variant="outline" size="sm" type="button" [disabled]="saindo()" (click)="sair()">
          {{ saindo() ? 'Saindo...' : 'Sair' }}
        </button>
      </div>
    </div>
  </header>
  <main class="mx-auto w-full max-w-md flex-1 p-4">
    <router-outlet />
  </main>
</div>
